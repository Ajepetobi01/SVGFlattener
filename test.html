<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SVG Flattener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.1);
      padding: 40px 48px;
      max-width: 560px;
      width: 100%;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p.desc { color: #555; margin: 0 0 28px; font-size: .95rem; line-height: 1.5; }

    .drop-zone {
      border: 2px dashed #bbb;
      border-radius: 8px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone.over, .drop-zone:hover { border-color: #555; background: #fafafa; }
    .drop-zone input[type=file] { display: none; }
    .drop-zone span { color: #777; font-size: .9rem; }
    .drop-zone strong { display: block; font-size: 1rem; color: #333; margin-bottom: 6px; }

    #fileInfo {
      margin-top: 16px;
      font-size: .9rem;
      color: #444;
      min-height: 1.2em;
    }

    button#flattenBtn {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    button#flattenBtn:hover:not(:disabled) { background: #333; }
    button#flattenBtn:disabled { background: #999; cursor: default; }

    .option-row {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .option-row label {
      font-size: .9rem;
      color: #444;
      white-space: nowrap;
    }
    .option-row select {
      flex: 1;
      padding: 8px 10px;
      font-size: .9rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      appearance: auto;
    }
    .option-row select:focus { outline: 2px solid #555; outline-offset: 1px; }

    #status {
      margin-top: 16px;
      min-height: 1.4em;
      font-size: .9rem;
      color: #444;
    }
    #status.error { color: #c00; }
    #status.ok { color: #080; }

    details { margin-top: 28px; }
    summary { cursor: pointer; color: #666; font-size: .85rem; }
    .test-section { padding-top: 16px; }
    .row { display: flex; gap: 24px; margin-bottom: 20px; font-size: .8rem; }
    .row > div { flex: 1; }
    pre {
      background: #f4f4f4; padding: 8px; border-radius: 4px;
      font-size: .75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
      max-height: 160px; overflow-y: auto;
    }
    h4 { margin: 0 0 4px; font-size: .85rem; }
  </style>
</head>
<body>

<div class="card">
  <h1>SVG Flattener</h1>
  <p class="desc">
    Converts all shapes to paths, bakes transforms, and resolves
    <code>clip-path</code> and <code>mask</code> references —
    producing clean, Figma-like output.
  </p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".svg">
    <strong>Drop an SVG here</strong>
    <span>or click to browse</span>
  </div>

  <div id="fileInfo"></div>

  <div class="option-row">
    <label for="dissolveSelect">Groups:</label>
    <select id="dissolveSelect">
      <option value="keep">Keep all groups (original)</option>
      <option value="dissolve">Dissolve leaf groups (Figma-like)</option>
    </select>
  </div>

  <button id="flattenBtn" disabled>Flatten &amp; Download</button>
  <div id="status"></div>

  <!-- ── Unit tests (collapsed by default) ───────────────────────────────── -->
  <details>
    <summary>Unit tests (transforms, shapes, clip-path, mask)</summary>
    <div class="test-section" id="testSection"></div>
  </details>
</div>

<script src="flatten_core.js"></script>
<script src="resolve_clips.js"></script>

<script>
(function () {
  'use strict';

  // ── Drop-zone / file picker ───────────────────────────────────────────────
  var dropZone   = document.getElementById('dropZone');
  var fileInput  = document.getElementById('fileInput');
  var fileInfo   = document.getElementById('fileInfo');
  var flattenBtn = document.getElementById('flattenBtn');
  var statusEl   = document.getElementById('status');

  var dissolveSelect = document.getElementById('dissolveSelect');

  var svgSource = '';
  var fileName  = '';

  dropZone.addEventListener('click', function () { fileInput.click(); });
  dropZone.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropZone.classList.add('over');
  });
  dropZone.addEventListener('dragleave', function () {
    dropZone.classList.remove('over');
  });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropZone.classList.remove('over');
    var file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });
  fileInput.addEventListener('change', function () {
    if (fileInput.files[0]) loadFile(fileInput.files[0]);
  });

  function loadFile(file) {
    if (!file.name.match(/\.svg$/i)) {
      setStatus('Please choose an SVG file.', 'error');
      return;
    }
    fileName = file.name;
    var reader = new FileReader();
    reader.onload = function (ev) {
      svgSource = ev.target.result;
      fileInfo.textContent = 'Loaded: ' + fileName + ' (' + Math.round(file.size / 1024) + ' KB)';
      flattenBtn.disabled = false;
      setStatus('');
    };
    reader.readAsText(file);
  }

  // ── Flatten pipeline ──────────────────────────────────────────────────────
  flattenBtn.addEventListener('click', function () {
    if (!svgSource) return;
    flattenBtn.disabled = true;
    setStatus('Processing…');

    // Place SVG off-screen so getScreenCTM() / getBBox() work correctly.
    var container = document.createElement('div');
    container.style.cssText = 'position:absolute;left:-99999px;top:0;width:20000px;height:20000px;';
    document.body.appendChild(container);
    container.innerHTML = svgSource;
    var svgEl = container.querySelector('svg');

    if (!svgEl) {
      document.body.removeChild(container);
      flattenBtn.disabled = false;
      setStatus('Error: no <svg> element found in the file.', 'error');
      return;
    }

    // Give the browser one frame to lay out before measuring.
    requestAnimationFrame(function () {
      try {
        // Step 1 – bake transforms, convert all shapes to <path>.
        flatten(svgEl);

        // Step 2 – resolve clip-path and mask references.
        resolveClipsAndMasks(svgEl);

        // Step 3 (optional) – dissolve leaf wrapper groups.
        if (dissolveSelect.value === 'dissolve') {
          dissolveGroups(svgEl);
        }

        // Serialise.
        var serializer = new XMLSerializer();
        var result = serializer.serializeToString(svgEl);
        if (!result.startsWith('<?xml')) {
          result = '<?xml version="1.0" encoding="utf-8"?>\n' + result;
        }

        // Download.
        var outName = fileName.replace(/\.svg$/i, '_flattened.svg');
        triggerDownload(result, outName, 'image/svg+xml');

        setStatus('Done! Saved as ' + outName, 'ok');
      } catch (err) {
        setStatus('Error: ' + err.message, 'error');
        console.error(err);
      } finally {
        document.body.removeChild(container);
        flattenBtn.disabled = false;
      }
    });
  });

  function triggerDownload(text, filename, mime) {
    var blob = new Blob([text], { type: mime });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href     = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(url);
    a.remove();
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className   = cls || '';
  }

  // ── Unit tests ────────────────────────────────────────────────────────────
  function svgMarkup(el) { return el.innerHTML.trim(); }

  function runTests() {
    var section = document.getElementById('testSection');

    var tests = [
      {
        title: 'Circle + translate/rotate transform',
        svg: '<svg id="t1a" width="200" height="200" xmlns="http://www.w3.org/2000/svg">' +
             '<g transform="translate(50,50) rotate(30)">' +
             '<circle cx="50" cy="50" r="40" fill="steelblue"/></g></svg>',
      },
      {
        title: 'Rounded rect + scale/translate',
        svg: '<svg id="t2a" width="200" height="200" xmlns="http://www.w3.org/2000/svg">' +
             '<g transform="scale(1.5) translate(10,10)">' +
             '<rect x="10" y="10" width="80" height="50" rx="10" ry="10" fill="tomato"/></g></svg>',
      },
      {
        title: 'Polygon toCubics=true',
        svg: '<svg id="t3a" width="200" height="200" xmlns="http://www.w3.org/2000/svg">' +
             '<g transform="rotate(45,100,100)">' +
             '<polygon points="100,20 180,180 20,180" fill="seagreen"/></g></svg>',
      },
      {
        title: 'clip-path (rect clips a path)',
        svg: '<svg id="t4a" width="200" height="200" xmlns="http://www.w3.org/2000/svg">' +
             '<defs><clipPath id="tc1"><rect width="60" height="60" transform="translate(20 20)"/></clipPath></defs>' +
             '<g clip-path="url(#tc1)">' +
             '<path d="M0 0 L100 0 L100 100 L0 100 Z" fill="purple"/></g></svg>',
      },
      {
        title: 'mask (inside-stroke pattern)',
        svg: '<svg id="t5a" width="200" height="200" xmlns="http://www.w3.org/2000/svg">' +
             '<defs><mask id="tm1" fill="white">' +
             '<path d="M20 20H80V80H20Z"/></mask></defs>' +
             '<path d="M20 20H80V80H20Z" stroke="#333" stroke-width="4" mask="url(#tm1)" fill="none"/></svg>',
      },
    ];

    tests.forEach(function (test, idx) {
      var row = document.createElement('div');
      row.className = 'row';

      // Before column
      var beforeDiv = document.createElement('div');
      var beforeLabel = document.createElement('h4');
      beforeLabel.textContent = 'Before — ' + test.title;
      var beforePre = document.createElement('pre');

      // Insert SVG into a temp holder so we can read its innerHTML
      var tmpHolder = document.createElement('div');
      tmpHolder.style.cssText = 'position:absolute;left:-9999px;width:2000px;height:2000px;';
      document.body.appendChild(tmpHolder);
      tmpHolder.innerHTML = test.svg;
      var svgEl = tmpHolder.querySelector('svg');
      beforePre.textContent = svgMarkup(svgEl);

      // After column
      var afterDiv = document.createElement('div');
      var afterLabel = document.createElement('h4');
      afterLabel.textContent = 'After';
      var afterPre = document.createElement('pre');

      requestAnimationFrame(function () {
        try {
          flatten(svgEl, idx === 2 /* toCubics for polygon test */);
          resolveClipsAndMasks(svgEl);
          afterPre.textContent = svgMarkup(svgEl);
        } catch (e) {
          afterPre.textContent = 'ERROR: ' + e.message;
        }
        document.body.removeChild(tmpHolder);
      });

      beforeDiv.appendChild(beforeLabel);
      beforeDiv.appendChild(beforePre);
      afterDiv.appendChild(afterLabel);
      afterDiv.appendChild(afterPre);
      row.appendChild(beforeDiv);
      row.appendChild(afterDiv);
      section.appendChild(row);
    });
  }

  runTests();
})();
</script>
</body>
</html>
